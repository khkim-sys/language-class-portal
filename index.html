<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 어학수업 신청</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #e3f0fd;
            overflow-x: hidden;
        }

        /* 둥글고 부드러운 그림자 효과 */
        .custom-shadow {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08), 0 10px 20px -5px rgba(0, 0, 0, 0.04);
        }

        /* 배경 장식용 아이콘 스타일 */
        .bg-icon {
            position: absolute;
            opacity: 0.05;
            z-index: -1;
            pointer-events: none;
        }

        .btn-hover-effect {
            transition: all 0.2s ease-in-out;
        }
        .btn-hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.15);
        }
        .btn-hover-effect:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative p-4">

    <!-- 배경 데코레이션 아이콘들 -->
    <svg class="bg-icon top-10 left-10 w-32 h-32 text-blue-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
    <svg class="bg-icon bottom-20 left-20 w-24 h-24 text-blue-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <svg class="bg-icon top-20 right-20 w-40 h-40 text-blue-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <svg class="bg-icon bottom-10 right-32 w-28 h-28 text-blue-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <svg class="bg-icon top-1/2 left-1/4 w-16 h-16 text-blue-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.54 15H17a2 2 0 0 0-2 2v4.54"/><path d="M7 3.34V5a3 3 0 0 0 3 3v0a2 2 0 0 1 2 2v0c0 1.1.9 2 2 2v0a2 2 0 0 0 2-2v0c0-1.1.9-2 2-2h1.66"/><path d="M11 21.95V18a2 2 0 0 0-2-2v0a2 2 0 0 1-2-2v-1a2 2 0 0 0-2-2H2.05"/><circle cx="12" cy="12" r="10"/></svg>

    <!-- 메인 컨테이너 -->
    <main class="bg-white rounded-3xl custom-shadow w-full max-w-[480px] p-8 md:p-10 relative z-10">

        <!-- 로고 영역 -->
        <div class="flex items-center justify-center space-x-4 mb-10 border-b pb-6 border-gray-100">
            <!-- DoubleU Games 로고 이미지 -->
            <img src="image_a89080.png" alt="DoubleU Games" class="h-7 md:h-8 object-contain">

            <div class="w-px h-6 bg-gray-300"></div>

            <!-- Double Down Interactive 로고 이미지 -->
            <img src="더블다운_2.png" alt="Double Down Interactive" class="h-7 md:h-8 object-contain">
        </div>

        <!-- 헤더 영역 -->
        <div class="text-center mb-8">
            <span class="inline-block px-4 py-1.5 rounded-full bg-[#f0f7ff] border border-[#dbeafe] text-[#2563eb] text-sm font-semibold mb-5">
                현재 4분기 어학수업 신청 기간
            </span>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-3 tracking-tight">사내 어학수업 신청</h1>
            <p class="text-gray-500 text-sm md:text-base">원하는 수업 유형을 선택해주세요</p>
        </div>

        <!-- 마감일 알림 -->
        <div class="bg-[#fffbeb] border border-[#fef3c7] text-[#92400e] text-sm md:text-base font-medium py-3 px-4 rounded-xl mb-8 text-center flex items-center justify-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="deadline-text">신청 마감: 9월 7일 계산 중...</span>
        </div>

        <!-- 버튼 영역 -->
        <div class="space-y-4">
            <!-- 1. 그룹수업 버튼 -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdxB2rDF2vh3sVgCOAaV2N0T5hjHIo-23QV9AlrKqk-niYmDg/viewform?usp=publish-editor"
               target="_blank"
               rel="noopener noreferrer"
               class="btn-hover-effect block w-full bg-[#3b82f6] text-white rounded-2xl py-5 px-6 text-center group">
                <div class="text-lg md:text-xl font-bold mb-1">사내어학 (그룹수업)</div>
                <div class="text-sm text-blue-100 font-medium group-hover:text-white transition-colors">강의실 직접 수업</div>
            </a>

            <!-- 2. 스픽 버튼 -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeJoGIRzN80ffXkXXaPtyCbyyctYDLIyGIOOHkpdfZOXasvbQ/viewform?usp=preview"
               target="_blank"
               rel="noopener noreferrer"
               class="btn-hover-effect block w-full bg-[#10b981] text-white rounded-2xl py-5 px-6 text-center group">
                <div class="text-lg md:text-xl font-bold mb-1">사내어학 (스픽)</div>
                <div class="text-sm text-emerald-100 font-medium group-hover:text-white transition-colors">AI 스피킹 앱 수업</div>
            </a>
        </div>

    </main>

    <script>
        // D-Day 계산 로직
        function calculateDDay() {
            const today = new Date();
            // 기준일: 현재 년도의 9월 7일
            let targetDate = new Date(today.getFullYear(), 8, 7); // month는 0(1월)부터 시작하므로 8은 9월

            // 테스트를 위해 날짜를 강제로 바꾸고 싶다면 아래 today 변수 주석을 풀고 날짜를 입력하세요.
            // const today = new Date('2026-09-02');

            // 만약 이미 9월 7일이 지났다면, 마감 처리 (필요에 따라 수정 가능)
            if (today.getTime() > targetDate.getTime() && today.getDate() !== 7) {
                 document.getElementById('deadline-text').innerText = "신청 기간이 마감되었습니다.";
                 return;
            }

            // 오늘 자정 기준으로 시간 초기화 (정확한 날짜 계산을 위해)
            today.setHours(0, 0, 0, 0);
            targetDate.setHours(0, 0, 0, 0);

            const diffTime = targetDate.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const deadlineElement = document.getElementById('deadline-text');

            if (diffDays === 0) {
                deadlineElement.innerText = `신청 마감: 9월 7일 (오늘 마감!)`;
            } else if (diffDays > 0) {
                deadlineElement.innerText = `신청 마감: 9월 7일 (${diffDays}일 남음)`;
            }
        }

        // 페이지 로드 시 계산 함수 실행
        window.onload = calculateDDay;
    </script>
</body>
</html>
